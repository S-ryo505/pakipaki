<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fff4ec">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>パキパキスクイーズ</title>
<style>
  :root {
    --ink: #4a3a3a; --ink-soft: #8a7470; --card: rgba(255,255,255,0.86); --line: rgba(120,80,70,0.14);
    --accent: #ff7f9e; --accent-ink: #fff; --shadow: 0 6px 20px rgba(120,60,60,0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff6ee; color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Noto Sans JP", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; transition: background .4s; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  #title { font-weight: 800; letter-spacing: .04em; font-size: 18px; }
  #meter { flex: 1; height: 8px; border-radius: 99px; background: rgba(120,80,70,0.12); overflow: hidden; }
  #meterFill { height: 100%; width: 0; background: linear-gradient(90deg, #ffb3c6, #ff7f9e); border-radius: 99px; transition: width .2s; }
  #meterText { font-size: 12px; color: var(--ink-soft); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; left: 0; right: 0; top: 18%; text-align: center; pointer-events: none; font-size: 18px; font-weight: 700;
    color: var(--ink); opacity: .85; transition: opacity .6s, transform .6s; }
  #hint small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-top: 6px; }
  #hint.gone { opacity: 0; transform: translateY(-10px); }
  #done { position: fixed; left: 50%; top: 16%; transform: translate(-50%, 10px); background: var(--card); padding: 10px 18px; border-radius: 99px;
    box-shadow: var(--shadow); font-weight: 700; opacity: 0; transition: .4s; pointer-events: none; white-space: nowrap; }
  #done.show { opacity: 1; transform: translate(-50%, 0); }
  #bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 18px); display: flex; justify-content: center; gap: 14px; pointer-events: none; }
  .btn { pointer-events: auto; border: 0; display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 99px;
    font: inherit; font-weight: 700; font-size: 15px; color: var(--ink); background: var(--card); box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn svg { width: 18px; height: 18px; }
  #scrim { position: fixed; inset: 0; z-index: 5; background: rgba(60,30,30,0.18); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #sheet { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; background: #fffdfb; border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 30px rgba(120,60,60,0.16); transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px); }
  #sheet.open { transform: translateY(0); }
  #sheet.open ~ #scrim { opacity: 1; pointer-events: auto; }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 2px auto 10px; }
  .sheetHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sheetHead h2 { font-size: 17px; margin: 0; }
  .x { border: 0; background: rgba(120,80,70,0.08); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--ink); }
  .sec { margin-top: 16px; }
  .sec h3 { font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 99px; font: inherit; font-size: 14px; }
  .chip.on { border-color: var(--accent); background: #fff0f4; color: #d34f72; font-weight: 700; }
  .sw { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line); position: relative; padding: 0; }
  .sw span { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink-soft); white-space: nowrap; }
  .sw.on { box-shadow: 0 0 0 2.5px var(--accent); }
  .row.swatches { gap: 26px 12px; padding-bottom: 18px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .foot { margin-top: 22px; display: flex; justify-content: center; }
  .seg { position: fixed; top: calc(env(safe-area-inset-top) + 50px); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px;
    background: var(--card); border-radius: 99px; box-shadow: var(--shadow); z-index: 2; }
  .seg .chip { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; white-space: nowrap; }
  .seg .chip.on { background: var(--accent); color: #fff; }
  body.puni .pakiOnly, body.puni #meter, body.puni #meterText { display: none; }
  body:not(.puni) .puniOnly { display: none; }
  #hint { top: 22%; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translate(-50%, 10px); background: rgba(60,40,40,.88); color: #fff;
    padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: 86%; text-align: center; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .link { border: 0; background: none; color: var(--ink-soft); text-decoration: underline; font: inherit; font-size: 13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="title">パキパキ</div><div id="meter"><div id="meterFill"></div></div><div id="meterText">はがれ 0%</div></div>
<div id="hint"><span id="hintMain"></span><small id="hintSub"></small></div>
<div id="modeSeg" class="seg"></div>
<div id="done">ぜんぶ はがれた！ リセットでもう一回</div>
<div id="bar">
  <button class="btn" id="btnReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>リセット</button>
  <button class="btn primary" id="btnDesign"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-1-.8-1.4-.8-2.3 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4c0-4.7-4-8.5-9-8.5z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.2" r="1.2" fill="currentColor"/><circle cx="15" cy="7.4" r="1.2" fill="currentColor"/></svg>デザイン</button>
</div>
<div id="sheet">
  <div class="grab"></div>
  <div class="sheetHead"><h2>デザイン</h2><button class="x" id="sheetClose" aria-label="とじる">×</button></div>
  <div class="sec"><h3>かたち</h3><div class="row" id="optShape"></div></div>
  <div class="sec" id="secFace"><h3>かお</h3><div class="row" id="optFace"></div></div>
  <div class="sec" id="secNori"><h3>のり</h3><div class="row" id="optNori"></div></div>
  <div class="sec" id="secItems"><h3>もちもの</h3><div class="row" id="optItems"></div></div>
  <div class="sec puniOnly" id="secSoft"><h3>やわらかさ（ぷにぷに）</h3><div class="row" id="optSoft"></div></div>
  <div class="sec puniOnly" id="secSpeed"><h3>もどる速さ（ぷにぷに・ふくろ）</h3><div class="row" id="optPuni"></div></div>
  <div class="sec"><h3>なかの色</h3><div class="row swatches" id="optBody"></div></div>
  <div class="sec pakiOnly"><h3>コーティングの質感</h3><div class="row" id="optStyle"></div></div>
  <div class="sec pakiOnly"><h3>コーティングの色</h3><div class="row swatches" id="optTint"></div></div>
  <div class="sec pakiOnly"><h3>コーティングの厚さ</h3><div class="row" id="optThick"></div></div>
  <div class="sec pakiOnly"><h3>ヒビの大きさ</h3><div class="row" id="optCrack"></div></div>
  <div class="sec"><h3>音の大きさ</h3><input type="range" id="volume" min="0" max="100"></div>
  <div class="sec"><h3>振動の強さ</h3><input type="range" id="vib" min="0" max="100"><div class="meta">振動モード：<span id="vibMode"></span></div></div>
  <div class="foot"><button class="link" id="btnDefaults">はじめの設定にもどす</button></div>
</div>
<div id="scrim"></div>
<div id="toast"></div>
